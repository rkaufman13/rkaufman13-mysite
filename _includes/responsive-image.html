{% capture srcset %}
{% for i in resized %}
    /{{ i.path }} {{ i.width }}w,
{% endfor %}
{% endcapture %}



<picture>
     {% for i in resized %}
        <source media="(min-width: {{ i.width }}px)" srcset="{{ i.path | prepend: '/'| prepend: site.baseurl | prepend: site.url}}">
    {% endfor %}
    <img src="{{ path |prepend: '/' | prepend: site.baseurl | prepend: site.url }}" alt="{{ alt }}">
</picture>
